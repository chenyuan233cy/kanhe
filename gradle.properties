# Gradle 构建参数
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Fabric / Minecraft
minecraft_version=26.4-snapshot-2
loader_version=0.19.5
loom_version=1.18.2
# 26.1 起游戏不再混淆，Fabric 为这类版本发布的是空 intermediary（0.0.0）
